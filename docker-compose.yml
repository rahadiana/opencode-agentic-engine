version: "3.9"

services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencode-agentic
    restart: unless-stopped
    networks:
      - agentic-net
    ports:
      - "4096:4096"
    environment:
      - OPENCODE_SERVER_HOSTNAME=0.0.0.0
      - OPENCODE_SERVER_PORT=4096
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
      # LLM provider — set via .env file (see .env.example)
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://rc2cu8i.abc-tunnel.us/v1}
      - LLM_MODEL=${LLM_MODEL:-StrongReason}
      - LLM_PROVIDER_NAME=${LLM_PROVIDER_NAME:-Custom LLM}
      # Also expose for the agentic-engine plugin's LLMEngine
      - OPENAI_BASE_URL=${LLM_BASE_URL:-https://rc2cu8i.abc-tunnel.us/v1}
      - OPENAI_MODEL=${LLM_MODEL:-StrongReason}
      # Model aliases (optional — fallback ke LLM_MODEL)
      - FAST_MODEL=${FAST_MODEL:-}
      - CAPABLE_MODEL=${CAPABLE_MODEL:-}
    volumes:
      - opencode_data:/root/.opencode
      - agentic_store:/workspace/.agentic
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:4096"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Embedding service (Ollama) ─────────────────────────────
  # Provides OpenAI-compatible embedding endpoint for vector search.
  # Plugin LocalEmbedder → http://ollama:11434/v1/embeddings
  # Uses nomic-embed-text (137MB) — light enough to run on CPU.
  ollama:
    image: ollama/ollama:latest
    container_name: agentic-ollama
    restart: unless-stopped
    networks:
      - agentic-net
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    volumes:
      - ollama_data:/root/.ollama
      - ./entrypoint-ollama.sh:/entrypoint-ollama.sh
    entrypoint: ["/bin/bash", "/entrypoint-ollama.sh"]
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  cloudflared:
    build:
      context: .
      dockerfile: Dockerfile.cloudflared
    container_name: agentic-tunnel
    restart: unless-stopped
    networks:
      - agentic-net
    depends_on:
      opencode:
        condition: service_healthy
    environment:
      - OPENCODE_URL=http://opencode:4096
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}

networks:
  agentic-net:

volumes:
  opencode_data:
  agentic_store:
  ollama_data:
