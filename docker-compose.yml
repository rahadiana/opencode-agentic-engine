version: "3.9"

services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opencode-agentic
    restart: unless-stopped
    networks:
      - agentic-net
    ports:
      - "4096:4096"
    environment:
      - OPENCODE_SERVER_HOSTNAME=0.0.0.0
      - OPENCODE_SERVER_PORT=4096
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:-opencode-agentic-2026}
      - OPENCODE_SERVER_USERNAME=${OPENCODE_SERVER_USERNAME:-opencode}
    volumes:
      - opencode_data:/root/.opencode
      - agentic_store:/workspace/.agentic
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:4096"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cloudflared:
    build:
      context: .
      dockerfile: Dockerfile.cloudflared
    container_name: agentic-tunnel
    restart: unless-stopped
    networks:
      - agentic-net
    depends_on:
      opencode:
        condition: service_healthy
    environment:
      - OPENCODE_URL=http://opencode:4096

networks:
  agentic-net:

volumes:
  opencode_data:
  agentic_store:
