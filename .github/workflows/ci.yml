name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: node test/run.mjs
      - run: node test/dropin.mjs
      - run: node test/load-samedir.mjs
      - run: LLM_OFF=true node test/swebench-harness.mjs
      - run: node test/e2e-scenario.mjs
      - run: node test/e2e-llm.mjs
        continue-on-error: true
