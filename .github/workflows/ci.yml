name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: node test/run.mjs
      - name: Setup dropin test
        run: |
          mkdir -p /tmp/dropin-project/.opencode/plugins/agentic-engine
          cp dist/index.js /tmp/dropin-project/.opencode/plugins/agentic-engine/index.js
          echo '{"name":"dropin-test"}' > /tmp/dropin-project/package.json
      - run: node test/dropin.mjs
      - run: node test/load-samedir.mjs
      - name: Setup EvoClaw fixture
        run: cp -r test/e2e-codebase-fixture /tmp/e2e-codebase
      - run: node test/swebench-harness.mjs
      - run: node test/e2e-scenario.mjs
      - run: node test/e2e-llm.mjs
        continue-on-error: true
