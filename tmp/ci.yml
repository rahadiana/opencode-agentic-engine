name: CI

# Run on every push and pull request to main branch
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for same workflow + branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Test on multiple Node.js versions
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run TypeScript type checking
        run: npm run typecheck
      
      - name: Build project
        run: npm run build
      
      - name: Run tests
        run: npm test
      
      - name: Check build artifacts
        run: |
          ls -lh dist/index.js
          echo "Build size: $(du -h dist/index.js | cut -f1)"
  
  # Job 2: Lint and code quality checks
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run TypeScript type checking
        run: npm run typecheck
      
      - name: Check for common issues
        run: |
          echo "Checking for console.log statements..."
          ! grep -r "console\.log" src/ || echo "Warning: console.log found"
          
          echo "Checking for TODO comments..."
          grep -r "TODO" src/ || echo "No TODOs found"
  
  # Job 3: Integration tests (E2E)
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Run E2E scenario tests
        run: npm run test:e2e
        continue-on-error: true
      
      - name: Run benchmark comparison tests
        run: node test/benchmark-comparison.mjs
        continue-on-error: true
      
      - name: Run error propagation tests
        run: node test/error-propagation.mjs
        continue-on-error: true
  
  # Job 4: Package validation
  package:
    name: Package Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Test npm pack
        run: |
          npm pack --dry-run
          echo "Package contents verified"
      
      - name: Check package size
        run: |
          npm pack
          PKG_SIZE=$(du -h *.tgz | cut -f1)
          echo "Package size: $PKG_SIZE"
          rm *.tgz
  
  # Job 5: All checks passed
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [test, lint, integration, package]
    
    steps:
      - name: Summary
        run: |
          echo "✅ All CI checks passed!"
          echo "✅ Tests: Passed"
          echo "✅ Lint: Passed"
          echo "✅ Integration: Passed"
          echo "✅ Package: Validated"
